<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title">
<title id="title">Open-source contribution statistics</title>
<style>
  text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .number { font-size: 64px; font-weight: 650; letter-spacing: -2px; fill: #132832; }
  .label { font-size: 15px; font-weight: 650; letter-spacing: 1.5px; fill: #0B6B3A; }
</style>
<rect width="1200" height="180" rx="28" fill="#F7F8F2"/>
<rect x="12" y="12" width="282" height="156" rx="24" fill="#FEFFF9" stroke="#D6DDD0"/><text x="38" y="96" class="number">5</text><text x="40" y="132" class="label">REPOSITORIES</text><circle cx="262" cy="40" r="5" fill="#72D95B"/>
<rect x="306" y="12" width="282" height="156" rx="24" fill="#EEF4E8" stroke="#D6DDD0"/><text x="332" y="96" class="number">13</text><text x="334" y="132" class="label">PULL REQUESTS</text><circle cx="556" cy="40" r="5" fill="#72D95B"/>
<rect x="600" y="12" width="282" height="156" rx="24" fill="#FEFFF9" stroke="#D6DDD0"/><text x="626" y="96" class="number">2</text><text x="628" y="132" class="label">MERGED</text><circle cx="850" cy="40" r="5" fill="#72D95B"/>
<rect x="894" y="12" width="282" height="156" rx="24" fill="#EEF4E8" stroke="#D6DDD0"/><text x="920" y="96" class="number">10</text><text x="922" y="132" class="label">OPEN</text><circle cx="1144" cy="40" r="5" fill="#72D95B"/>
</svg>
